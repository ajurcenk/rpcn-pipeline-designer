name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # check-types + lint (AD-15 dependency direction) + esbuild bundle
      - run: npm run compile

      # VS Code 1.100.0 is the engines floor (ticket 2.11); its download is pinned, so cache it
      - uses: actions/cache@v6.1.0
        with:
          path: .vscode-test/vscode-linux-x64-1.100.0
          key: vscode-1.100.0-${{ runner.os }}-${{ runner.arch }}

      # unit + integration tests in two downloaded VS Codes, latest stable and 1.100.0 (needs a display)
      - run: xvfb-run -a npm test

      # Corpus harness (ticket 1.7): pinned standalone binaries, keyed on fetch-binaries.sh (which pins the versions)
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/redpanda-connect
          key: redpanda-connect-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/spike/fetch-binaries.sh') }}

      - name: Fetch Redpanda Connect 4.100.0 and 4.112.0
        run: scripts/spike/fetch-binaries.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # lint every test/corpus/*.yaml with both binaries; CI=true turns a missing binary into a failure
      - name: Corpus harness
        run: npm run test:corpus
        env:
          CI: 'true'

      # Graph view (ticket 3.4): layout and theme-token tests of webview/, plain Node
      - run: npm run test:webview

      - run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rpcn-pipeline-designer-vsix
          path: '*.vsix'
          if-no-files-found: error
