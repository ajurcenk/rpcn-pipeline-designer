name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # check-types + lint (AD-15 dependency direction) + esbuild bundle
      - run: npm run compile

      # VS Code 1.100.0 is the engines floor (ticket 2.11); its download is pinned, so cache it
      - uses: actions/cache@v6.1.0
        with:
          path: .vscode-test/vscode-linux-x64-1.100.0
          key: vscode-1.100.0-${{ runner.os }}-${{ runner.arch }}

      # Pinned standalone binaries, keyed on fetch-binaries.sh (which pins the versions): the corpus
      # harness (ticket 1.7) and, since ticket 9, the real-binary Run and Stop suite need them, so they
      # are fetched before the VS Code tests (GitHub sets CI=true: a missing binary fails both)
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/redpanda-connect
          key: redpanda-connect-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/spike/fetch-binaries.sh') }}

      - name: Fetch Redpanda Connect 4.100.0 and 4.112.0
        run: scripts/spike/fetch-binaries.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # unit + integration tests (needs a display): the latest stable VS Code is required; the 1.100.0
      # floor reports but doesn't fail the build (user decision 2026-10-16: its timing flakes are out of
      # scope and must not hide the steps below)
      - run: npm run pretest

      # bug 19: relaunched once only when VS Code froze at startup before any test ran (never on a test failure)
      - name: VS Code tests (stable)
        run: scripts/vscode-test-ci.sh stable

      # ticket 28: per-folder settings in a real two-folder workspace; blocks the build like stable
      - name: VS Code tests (multi-root)
        if: ${{ !cancelled() }}
        run: scripts/vscode-test-ci.sh multiroot

      - name: VS Code tests (1.100.0 floor, non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: xvfb-run -a npx vscode-test --label floor

      # lint every test/corpus/*.yaml with both binaries; CI=true turns a missing binary into a failure
      - name: Corpus harness
        if: ${{ !cancelled() }}
        run: npm run test:corpus
        env:
          CI: 'true'

      # Graph view (ticket 3.4): layout and theme-token tests of webview/, plain Node
      - if: ${{ !cancelled() }}
        run: npm run test:webview

      - if: ${{ !cancelled() }}
        run: npx vsce package --no-dependencies

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rpcn-pipeline-designer-vsix
          path: '*.vsix'
          if-no-files-found: error
