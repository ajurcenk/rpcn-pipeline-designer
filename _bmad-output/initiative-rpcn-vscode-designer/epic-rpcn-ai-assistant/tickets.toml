risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Boundaries and approvals"
description = "The shell rule, the write rules (a stage's own artifact without asking, other writes ask, outside the workspace denied) and reads inside the active skills copy, in one place for the pre-tool hook and `canUseTool`; approval prompts shown in the view, each with Allow once, Allow for this session and Deny. Allow for this session remembers a shell command's program and subcommand (for example `rpk connect list`), and a write's tool, until the window reloads. A pipeline of read-only programs (for example `rpk connect list … | python3 -I -c …`, `strings`, `grep`, `head`, `cut`) is remembered as its chain of programs; a command with `;`, `&&`, redirects to a file, `$(…)`, `rpk connect run` or any program that writes always asks again; the agent's whole environment built by the extension with its config, `uv` and XDG folders in the extension's storage; `settingSources` empty."
verify = "Fake-model tests: chained and foreign commands ask, a workspace `rpcn_check.py` asks, writes outside the workspace are denied, the stage's own file is written without asking, and a listing of the user's home shows no new entry after a run."
covers = ["R6", "R8"]
after = [3]
hitl = false
risk = "high"

