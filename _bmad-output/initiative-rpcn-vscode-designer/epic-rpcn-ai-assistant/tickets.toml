# tickets.toml — epic 8, RPCN AI Assistant. The order of the tables is the build order.
# Lanes:
# - 1 is the tracer.
# - 2 then 10 are packaging and the skills source, beside the app work.
# - 3 then 5 touch the agent adapter, in that order.
# - 4 then 8 are the tool layer.
# - 6 → 7 → 9 are the view, in that order.
# - 11 is the refactor sweep.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: from a request to a ready design note in the assistant view"
description = "The thinnest path through every layer AD-26 names: the AssistantHost port; an AgentSdkHost adapter on the pinned Agent SDK, loading a bundled `rpcn-skills` copy as a plugin with the model, base URL and key in its environment; minimal access (settings plus a key in secret storage); a plain assistant view where a request runs `rpcn-design`, its `AskUserQuestion` shows as answerable cards and the written note shows with its status. It also builds the two test fakes every later entry reuses: a scripted in-memory AssistantHost and a local fake Messages API with scripted turns."
verify = "In the dev host the user's real request through their endpoint reaches the question cards and a `ready` note (the manual check, at most 2 runs); the integration suites repeat it on the fake host and on the real SDK against the fake Messages API, with no real model call."
covers = ["R1", "R2", "R3"]
after = ["epic-smart-yaml-editing"]
hitl = true
risk = "high"
references = ["../../backlog/spike-can-the-extension-host-the-agent-sdk-through-the-adp-proxy-findings/findings.md", "../architecture-rpcn-vscode-designer/architecture-rpcn-vscode-designer.md"]
notes = ["The user provides the endpoint and a test key for the manual check, as for spike 65."]

[[entry]]
id = 2
type = "story"
title = "One VSIX per platform, with the pinned skills and the Claude Code binary"
description = "CI builds one VSIX per platform (Linux and macOS targets) carrying the pinned Agent SDK with only that platform's Claude Code binary and the bundled `rpcn-skills` copy at a recorded pin (a build script copies it in); adds the `path` override for a local skills checkout; records each package's size."
verify = "CI produces the Linux and macOS VSIXes with their sizes; each installs on a clean VS Code and runs entry 1's request through a real endpoint in the user's manual check (macOS by the user)."
covers = ["R9"]
after = [1]
hitl = true
risk = "high"
unknown = "Whether the SDK's optional per-platform packages can be limited to one platform in a VSIX build without its install falling back to downloading."

[[entry]]
id = 3
type = "story"
title = "Assistant access: set up, test connection, forget, the model list and the access states"
description = "Set up assistant access… asks for the base URL, auth and key, makes one test call and stores the key in secret storage only; the model setting offers the endpoint's `/v1/models`; Forget assistant access removes it; the view shows the no binary, no access, key refused, model not allowed and unreachable states, mapping ADP's and Anthropic's error formats."
verify = "Integration tests against a fake endpoint cover set up, the test call, forget, the model list and each access state's text and action, and find the key in no setting, file, argument, log or message."
covers = ["R2", "R7", "R8"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "The rpcn tool layer, in process"
description = "The `rpcn_*` tools (binary, list, fields, lint, Bloblang check, dry run, test, handoff check) on the extension's own binary resolution (AD-9) and lint arguments (AD-12), each returning `rpcn_check`'s SCHEMA.md envelope, served by an in-process MCP server with `alwaysLoad`."
verify = "Unit tests show each tool's envelope equal to `rpcn_check.py`'s for the same inputs, errors included; a fake-model test shows the agent offered the tools from its first request."
covers = ["R5"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Boundaries and approvals"
description = "The shell rule, the write rules (a stage's own artifact without asking, other writes ask, outside the workspace denied) and reads inside the active skills copy, in one place for the pre-tool hook and `canUseTool`; approval prompts shown in the view; the agent's whole environment built by the extension with its config, `uv` and XDG folders in the extension's storage; `settingSources` empty."
verify = "Fake-model tests: chained and foreign commands ask, a workspace `rpcn_check.py` asks, writes outside the workspace are denied, the stage's own file is written without asking, and a listing of the user's home shows no new entry after a run."
covers = ["R6", "R8"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "The Design stage, complete"
description = "Everything the prototype's Design screens and states show: question rounds with \"(My pick)\" and an Other answer, the existing-note update-or-leave question, the note preview with its status and open decisions, Build off while a blocking decision is open (answered in place by a re-run), progress steps and the waiting state, follow-up messages, Stop and a new conversation, and the stage from files after a reload; settles whether to hide Claude Code's bundled skills further."
verify = "Fake-host integration tests for each Design screen and state of the prototype, a fake-model test of a full design round, and a reload test that keeps the stage; one real run in the user's manual check."
covers = ["R1", "R3", "R7"]
after = [5]
hitl = false
risk = "medium"
references = ["https://claude.ai/artifact/AMTmvbHVtSS3wKBZudoWtq"]

