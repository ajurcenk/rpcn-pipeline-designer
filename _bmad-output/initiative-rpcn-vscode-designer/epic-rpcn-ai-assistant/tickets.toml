# tickets.toml — epic 8, RPCN AI Assistant. The order of the tables is the build order.
# Lanes:
# - 1 is the tracer.
# - 2 then 10 are packaging and the skills source, beside the app work.
# - 3 then 5 touch the agent adapter, in that order.
# - 4 then 8 are the tool layer.
# - 12 is the chat view, after 2 (both change the webview); 6 → 7 → 9 then fill it, in that order.
# - 13 → 14 are existing pipelines, after 12 and their stages; they wait for the rpcn-skills modes.
# - 11 is the refactor sweep.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: from a request to a ready design note in the assistant view"
description = "The thinnest path through every layer AD-26 names: the AssistantHost port; an AgentSdkHost adapter on the pinned Agent SDK, loading a bundled `rpcn-skills` copy as a plugin with the model, base URL and key in its environment; minimal access (settings plus a key in secret storage); a plain assistant view where a request runs `rpcn-design`, its `AskUserQuestion` shows as answerable cards and the written note shows with its status. It also builds the two test fakes every later entry reuses: a scripted in-memory AssistantHost and a local fake Messages API with scripted turns."
verify = "In the dev host the user's real request through their endpoint reaches the question cards and a `ready` note (the manual check, at most 2 runs); the integration suites repeat it on the fake host and on the real SDK against the fake Messages API, with no real model call."
covers = ["R1", "R2", "R3"]
after = ["epic-smart-yaml-editing"]
hitl = true
risk = "high"
references = ["../../backlog/spike-can-the-extension-host-the-agent-sdk-through-the-adp-proxy-findings/findings.md", "../architecture-rpcn-vscode-designer/architecture-rpcn-vscode-designer.md"]
notes = ["The user provides the endpoint and a test key for the manual check, as for spike 65."]

[[entry]]
id = 2
type = "story"
title = "The assistant runtime, installed by the user from VS Code"
description = "Install assistant runtime… (after explicit agreement to Anthropic's terms) downloads the pinned Agent SDK and this platform's binary package straight from the npm registry, checks them against sha512 hashes pinned in `assets/agent-runtime.json`, and unpacks them into the extension's global storage, where the assistant loads them from; Update and Remove commands, the not-installed, installing and failed states, one VSIX for all platforms again, and the `skillsPath` override for a local skills checkout."
verify = "Integration tests on a fake registry cover agree-and-install, a bad hash, an interrupted or offline download, update and remove, and loading only from the installed runtime; CI packs one VSIX; in the user's manual check the VSIX installs on a clean VS Code on Linux and macOS, the runtime installs and 8.1's request runs through a real endpoint."
covers = ["R9"]
after = [1]
hitl = true
risk = "high"
unknown = "Whether the extension host's fetch honours VS Code's proxy settings for the registry download, or the download needs its own proxy handling."

[[entry]]
id = 12
type = "story"
title = "The chat view, in the prototype's option A layout"
description = "Rebuild the assistant view as the prototype's option A (Chat transcript): a thin stage strip (Design › Author › Test) and New conversation; turns for the user and rpcn, each rpcn turn naming the skill it used; the agent's reply rendered as sanitised, masked Markdown; tool calls as step rows with a mark and a short result (for example `0 errors · 1 fixed`), earlier turns folding to one line; the files a turn wrote or changed with +N/−N, a click opening VS Code's diff against the copy from before the turn; Keep and Undo for the turn (Undo restores every file to its copy from before the turn); next-step buttons and chips; a composer with `/design`, `/build` and `/test` and their autocomplete. Every existing state (access, runtime, question cards, approval, stopped, error) renders inside the chat. It builds the slots; 8.6, 8.7 and 8.9 fill them for their stages (Open graph, Run locally, Test). Theme colours only."
verify = "Webview unit tests for each part; fake-host integration tests for the turns, the step rows, a file row opening its diff, Undo restoring the files from before the turn, Keep, the slash commands and every existing state inside the chat; the user's manual check of the look against option A."
covers = ["R1", "R6", "R8"]
after = [2]
hitl = false
risk = "medium"
references = ["https://claude.ai/artifact/AMTmvbHVtSS3wKBZudoWtq#artboard-ChatA"]
notes = ["Chosen by the user on 2026-11-25 over option B (stage cards) and option C (Copilot-style); option A's History button is left out, because the conversation starts fresh after a reload (epic Decision)."]

[[entry]]
id = 3
type = "story"
title = "Assistant access: set up, test connection, forget, the model list and the access states"
description = "Set up assistant access… asks for the base URL, auth and key, makes one test call and stores the key in secret storage only; the model setting offers the endpoint's `/v1/models`; Forget assistant access removes it; the view shows the no binary, no access, key refused, model not allowed and unreachable states, mapping ADP's and Anthropic's error formats."
verify = "Integration tests against a fake endpoint cover set up, the test call, forget, the model list and each access state's text and action, and find the key in no setting, file, argument, log or message."
