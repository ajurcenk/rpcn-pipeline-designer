# tickets.toml — the initiative's epics in build order.

[[epic]]
id = 1
slug = "epic-foundation"
title = "Foundation: binary, schema and release pipeline"
covers = ["CAP-1", "CAP-13", "CAP-14"]   # CAP-13: .vsix packaging only; registry publishing parked

[[epic]]
id = 2
slug = "epic-smart-yaml-editing"
title = "Smart YAML editing and local run"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4", "CAP-5", "CAP-6", "CAP-11", "CAP-14"]
after = [{ epic = 1, needs = "RedpandaConnect adapter (binaryState, arg builder, spawn), cached transformed schema, CI + corpus harness, spike-verified lint and schema output" }]

[[epic]]
id = 3
slug = "epic-pipeline-graph"
title = "Read-only pipeline graph"
covers = ["CAP-1", "CAP-6", "CAP-7", "CAP-8", "CAP-9", "CAP-10", "CAP-12", "CAP-14"]
after = [{ epic = 1, needs = "cached transformed schema for the ComponentCatalog, binaryState / hostStatus" }, { epic = 2, needs = "DetectionRegistry (onDidChangeDetection, session mark hook) and the deduped per-URI diagnostics accessor" }]

[[epic]]
id = 4
slug = "epic-bloblang-check-and-test"
title = "Bloblang check and test"
covers = ["CAP-1", "CAP-13", "CAP-14", "CAP-15", "CAP-16", "CAP-17"]   # second release
after = [{ epic = 1, needs = "RedpandaConnect adapter (binaryState, spawn site, arg builder), corpus harness with pinned v4.100.0 and v4.112.0" }, { epic = 2, needs = "Bloblang regions and field list (AD-14), parse cache, deduped diagnostics and the diagnostics adapter" }, { epic = 3, needs = "PipelineModel ids and ranges, NodeStatusService and its diagnostics input (AD-17), webview bundle, html/CSP and panel group logic to reuse" }]

[[epic]]
id = 5
slug = "epic-deploy-to-redpanda-cloud"
title = "Deploy to Redpanda Cloud"
covers = []   # no spec capability yet: the spec lists Cloud deployment as a non-goal (Source conflict, settled by the user 2026-11-02)
after = [{ epic = 1, needs = "the lint/run argument builder (1.5) for the pre-deploy check" }, { epic = 2, needs = "lint on save (2.4) for the pre-deploy check" }]
