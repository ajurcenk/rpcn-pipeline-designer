# tickets.toml — epic-smart-yaml-editing (E2). Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Detected config gets completion and hover from the binary's schema"
description = "Adds a minimal DetectionRegistry (content predicate: top-level input/pipeline/output/buffer or resource keys) and a Red Hat YAML contributor that answers requestSchema for detected files with a URI in our own scheme embedding the schema hash and serves requestSchemaContent from the in-memory SchemaStore, following its onDidChange (AD-10, AD-11)."
verify = "In the Extension Development Host a detected corpus config shows component completion and the merged hover docs, a non-pipeline YAML file shows none, and after Set path to another version completion follows without reopening the file."
covers = ["E2 (R1)", "E2 (R2)"]
after = ["epic-foundation"]
hitl = false
risk = "medium"
unknown = "Whether Red Hat YAML re-requests schema content when only the content behind a URI changes; the hash in the URI is meant to force it."

[[entry]]
id = 2
type = "story"
title = "Complete file detection"
description = "Completes the DetectionRegistry: redpandaConnect.filePatterns, templates (top-level name + type + mapping) excluded, recomputation on open/change/setting change, onDidChangeDetection, and the session-mark hook epic 3's Show graph calls (AD-18)."
verify = "Unit tests cover the predicate (patterns, keys, templates, resource-only files), and an integration test shows a file becoming detected after typing `input:` without reopening."
covers = ["E2 (R2)"]
after = [1]
hitl = false
risk = "low"
unknown = "None."

[[entry]]
id = 3
type = "story"
title = "Spawn site: caller environment and a streaming child handle"
description = "Extends the single spawn site (process.ts) so a caller passes the builder's {command, args, env} with NO_COLOR=1 still forced, and adds a long-lived streaming child handle (stdout/stderr events, exit, kill) beside the buffered one-shot runner; existing callers keep their behavior (AD-9, AD-13)."
verify = "Unit tests show a caller env reaching the child with NO_COLOR=1 forced, a streaming child delivering output before exit and being killable, and the existing suite passing unchanged."
covers = ["E2 (R3)", "E2 (R8)"]
after = []
hitl = false
risk = "medium"
unknown = "None."

[[entry]]
id = 4
type = "story"
title = "Lint on save shows diagnostics"
description = "On save of a detected file, runs lint through buildLintCommand (resource files from the redpandaConnect.resourceFiles setting) and the spawn site, parses stderr in src/core, publishes findings on whole lines (Error; `field … is deprecated` as Warning), suppresses a lint diagnostic on a line Red Hat already flags, clears the file's lint diagnostics on its first edit after save, and exposes to epic 3 a deduped per-URI diagnostics accessor with a change event (AD-12, AD-17)."
verify = "Saving a config with an unknown field shows an Error on that line from Redpanda Connect lint, a deprecated field shows a Warning, the first edit clears them, and unit tests cover the parser on the spike captures."
covers = ["E2 (R3)", "E2 (R4)"]
after = [2, 3]
hitl = false
risk = "medium"
unknown = "Red Hat diagnostics can arrive after lint, so dedupe re-runs on onDidChangeDiagnostics keyed on source `yaml`; whether file-level findings at (1,1) (YAML syntax, env vars) should be suppressed against Red Hat's syntax errors."

[[entry]]
id = 5
type = "story"
title = "Quick Fix for unknown fields"
description = "For a lint diagnostic `field X not recognised`, offers the closest valid field names at that position from the schema store, applied as a minimal-range WorkspaceEdit (AD-19)."
verify = "On `nope:` under a mapping processor the Quick Fix menu lists valid field names, applying one replaces only the key, and comments and formatting elsewhere are unchanged."
covers = ["E2 (R5)"]
after = [4]
hitl = false
risk = "medium"
unknown = "How to locate the schema node for a YAML position (document path to the definitions/<cat>/anyOf branch)."

[[entry]]
