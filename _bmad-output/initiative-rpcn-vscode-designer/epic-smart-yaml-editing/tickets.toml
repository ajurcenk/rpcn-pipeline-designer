after = [4]
hitl = false
risk = "low"
unknown = "None."

[[entry]]
id = 7
type = "story"
title = "Run and Stop in a per-file terminal"
description = "Enables Run (editor-title action on detected files and command) and Stop (status-bar item and command): Run auto-saves a detected, saved file and runs buildRunCommand (resource files from the redpandaConnect.resourceFiles setting) on the streaming child in a Pseudoterminal per URI, reused on re-run; Stop sends SIGINT and SIGKILL after a grace period; the exit status replaces the Stop item; untitled files cannot Run and show \"Save the file to run it.\" (AD-13, EXPERIENCE Run control)."
verify = "Running a generate-to-stdout corpus config streams its output, Stop ends it, a second Run reuses the terminal, and Run is unavailable for an untitled file with the tooltip shown."
covers = ["E2 (R8)"]
after = [2, 3, 4, 10]
hitl = false
risk = "medium"
unknown = "The grace period before SIGKILL."
notes = ["Waits on 4 and 10 for shared files (extension.ts composition root, package.json contributions), not their behavior."]

[[entry]]
id = 13
type = "story"
title = "Schema completion fixes: incomplete components and value options"
description = "The schema transform drops `required` so Red Hat still offers a component's fields while a required field is missing, and turns json-full `options` / `annotated_options` into value suggestions (one of the options, or any string) with their descriptions; TRANSFORM_VERSION bumps (AD-10, AD-12: lint stays the validation)."
verify = "Under `file:` with only `codec: lines`, completion offers `path`; after `codec: `, completion offers all-bytes, append, delim:x and lines with descriptions; `codec: delim:foobar` gets no schema error; corpus and suite green."
covers = ["E2 (R1)"]
after = [1]
hitl = false
risk = "low"
unknown = "Empty component blocks (`generate:` with nothing under it) still get no completions; investigated separately."
notes = ["Found in the user's manual check of 2.7 (2026-10-07): Ctrl+Space under an incomplete `file:` showed only word suggestions."]

