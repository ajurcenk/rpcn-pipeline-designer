# tickets.toml — epic-bloblang-check-and-test's agreed children. The order of the tables is the build order; `id` names a child for good.
# Lanes: panel (2 → 7 → 8 → 9 → 10 → 11, serialised: shared panel adapter, panel webview, src/extension.ts), core (3), diagnostics (5 → 6), corpus (12).
# Every entry names the earlier tickets its code meets and adds a combined-sequence test for each boundary (E3 retro AI-7), and updates the AD / EXPERIENCE / DESIGN line it decides in the same commit (AI-8).

[[entry]]
id = 1
type = "spike"
title = "Probe Bloblang execution on the binary"
description = "Compares three routes on v4.100.0, v4.112.0 and the user's `rpk connect` (`blobl server` POST /execute, `blobl` with input on stdin, and a one-message pipeline through `run`) for input and output metadata, deleted messages, parse and mapping error text and positions, and the time per test and per keystroke parse, then writes the findings and a proposed AD-21 (which route serves the live parse and which serves the test panel) for the user to approve."
verify = "The findings file holds a measured table per route and version, and AD-21 is in the architecture spine marked approved by the user."
covers = ["R13"]
after = ["1.1", "1.7"]
hitl = true
risk = "low"
unknown = "Whether `blobl server` exists and answers the same on v4.100.0; whether a one-message `run` is fast enough to re-run on each edit."
references = ["_bmad-output/initiative-rpcn-vscode-designer/spec-rpcn-vscode-designer/research-and-cli-reference.md#cli-facts-docs-262-connect-v41120"]

[[entry]]
id = 2
type = "story"
title = "Tracer: Test mapping opens a panel that runs the mapping on typed JSON"
description = "The thinnest path through every layer: a \"▷ Test mapping\" CodeLens above `mapping:` / `mutation:` fields and the \"Redpanda Connect: Test mapping\" command, a stdin option on the AD-9 spawn site and a Bloblang execution module on the route AD-21 chose (content only), a minimal core function returning one processor's Bloblang text, a second esbuild webview bundle with `html.ts` parameterised and a minimal protocol (ready, run request, result), and one panel per mapping beside the editor that shows the output of typed JSON input."
verify = "An integration test with a fake binary (a new `blobl` branch in `connectScript`) runs Test mapping on a `mapping` processor, posts an input, and receives the fake's output in a result message; the user sees the panel run a real mapping in the dev host."
covers = ["R4", "R5", "R12"]
after = [1, "1.3", "2.3", "2.9", "3.1"]
hitl = false
risk = "medium"
unknown = "Which editor group the panel opens in beside the graph's locked group; this entry picks one and entry 10 settles it."

[[entry]]
id = 3
type = "story"
title = "Bloblang text and position map for mapping and mutation processors"
description = "Completes the core function from entry 2: for every `mapping` and `mutation` processor (nested, and under `processor_resources`), the decoded Bloblang text of block, folded, plain, single- and double-quoted scalars and a map from Bloblang line and column to a UTF-16 document offset, keyed by the processor's AD-7 node id."
verify = "Unit tests round-trip every scalar style (each Bloblang position maps to the document character it came from), and the corpus harness checks the map on every corpus mapping."
covers = ["R1"]
after = [2, "2.19", "3.3"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Full test-panel protocol and result types with fixtures"
description = "Completes the panel's protocol in `src/shared` (host → webview: snapshot, result {ok with content and metadata and changes, failed, parse error, deleted, invalid input}, samples, host status; webview → host: ready, input edited, run, sample added, renamed, deleted, switched, go to line, install guide, set path, retry) with hand-written validators as in `protocol.ts`, plus fixture results the webview lane renders before the host sends them."
verify = "Type-checked unit tests pin every message's shape and reject malformed ones, and every fixture passes the validators."
covers = ["R5", "R6", "R7", "R9"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Live Bloblang syntax diagnostics"
description = "A parse service in the adapters parses each changed `mapping` / `mutation` (entry 3's text) on the binary by AD-21's route, debounced and single-flight per mapping with stale results dropped, and publishes the errors in a new \"Bloblang\" diagnostics collection at entry 3's mapped positions; AD-14 and AD-12 are amended in the same commit."
verify = "Integration tests with a fake binary show a parse error at the expected line and column after typing, clear it after the fix, keep lint's findings untouched, and send one parse per mapping for a burst of keystrokes."
covers = ["R2", "R13"]
after = [3, "2.4"]
hitl = false
risk = "medium"
unknown = "What the Bloblang diagnostics do while the YAML itself does not parse (keep the last ones, or clear them); this entry decides it with the user."

